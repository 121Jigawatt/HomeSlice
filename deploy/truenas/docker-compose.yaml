# HomeSlice for TrueNAS SCALE: Apps > Discover Apps > (⋮) Install via YAML.
# Storage uses named volumes, which TrueNAS keeps in the apps pool's ix-apps dataset (no datasets to create).
services:
  homeslice:
    image: ghcr.io/121jigawatt/homeslice:latest
    # Without this, redeploying keeps the cached :latest image.
    pull_policy: always
    container_name: homeslice
    restart: unless-stopped
    environment:
      PUID: "568"
      PGID: "568"
      TZ: "Etc/UTC"
      # "true" because the app is served over HTTPS (port 8443 below, or `tailscale serve`).
      HOMESLICE_COOKIE_SECURE: "true"
      HOMESLICE_MAX_UPLOAD_MB: "500"
      HOMESLICE_SLICE_WORKERS: "1"
    volumes:
      - homeslice-config:/config
      - homeslice-data:/data
    ports:
      # Only the authenticated proxy is published (HTTPS, self-signed). Never publish 3000/3001 (raw desktop stream).
      - "8443:8443"
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

volumes:
  homeslice-config:
  homeslice-data:
