user abc;
worker_processes 1;
pid /tmp/homeslice-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/homeslice-nginx-body;
    proxy_temp_path /tmp/homeslice-nginx-proxy;
    fastcgi_temp_path /tmp/homeslice-nginx-fastcgi;
    uwsgi_temp_path /tmp/homeslice-nginx-uwsgi;
    scgi_temp_path /tmp/homeslice-nginx-scgi;

    limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        listen [::]:8080;
        # The streamed GUI needs a browser secure context. Cert + private CA come from init-homeslice-config.
        listen 8443 ssl;
        listen [::]:8443 ssl;
        ssl_certificate /config/ssl/homeslice.pem;
        ssl_certificate_key /config/ssl/homeslice.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Public CA certificate, so phones and PCs can be set to trust this server (not secret).
        location = /homeslice-ca.crt {
            alias /config/ssl/homeslice-ca.pem;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="homeslice-ca.crt"';
        }

        # Must match HOMESLICE_MAX_UPLOAD_MB.
        client_max_body_size 512m;

        location = /_auth {
            internal;
            proxy_pass http://127.0.0.1:8000/api/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Streamed OrcaSlicer desktop GUI (Selkies), only for logged-in users.
        location /gui/ {
            auth_request /_auth;
            error_page 401 = @login;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
            proxy_buffering off;
        }

        location @login {
            return 302 /login?next=/gui/;
        }

        location ~ ^/api/auth/(login|setup)$ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8000;
            # Keep the port so the backend's Origin check matches the browser's Origin.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            # Overwrite (not append) so clients can't spoof their IP for rate limiting.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 15m;
        }
    }
}
