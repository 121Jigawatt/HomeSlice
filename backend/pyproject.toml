[project]
name = "homeslice"
version = "0.1.0"
description = "Self-hosted web front-end for OrcaSlicer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "httpx>=0.27,<1",
    "pillow>=10.4",
    "numpy>=1.26",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homeslice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
